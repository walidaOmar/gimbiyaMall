[build]
  # Build from repo root so Vite and the server esbuild step run together
  command = "pnpm install && pnpm build"
  publish = "dist/public"

# API proxy — MUST come before the /* catch-all. `force = true` ensures
# Netlify forwards the request even if a local file exists.
[[redirects]]
  from   = "/api/*"
  to     = "https://gimbiya-mall-backend-production.up.railway.app/api/:splat"
  status = 200
  force  = true

  [redirects.headers]
    X-Forwarded-Host = ":splat"

# SPA fallback — all non-file routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
