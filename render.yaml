services:
  - type: web
    name: gimbiya-mall-backend
    env: node
    plan: standard
    rootDir: backend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gimbiya_mall
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /
    maxInstances: 3
