services:
  - type: web
    name: gimbiya-mall-backend
    env: node
    plan: starter
    # Build runs from the repository root so pnpm can resolve the workspace
    # lockfile and the root tsconfig. The compiled server lands in dist/index.js.
    buildCommand: pnpm install && pnpm build:server
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: gimbiya_mall
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: https://gimbiyamall.netlify.app
    healthCheckPath: /api/trpc/auth.me
